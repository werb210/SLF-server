name: CI Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # SLF_CI_STRICT_v789 - the same major as the deploy and package.json engines.
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Verify Node Version
        run: node -v

      # npm ci only: a lockfile that does not match package.json is a failure,
      # not something to paper over with npm install.
      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Run once. A retry hides flaky tests instead of fixing them.
      - name: Tests
        run: npm test

      - name: Source-grep test guard
        run: node scripts/check-source-grep-tests.mjs

      - name: Audit report
        if: always()
        run: |
          npm audit --json > audit.json || true
          echo "Node version: $(node -v)" > report.txt
          echo "" >> report.txt
          echo "Dependency Audit:" >> report.txt
          cat audit.json >> report.txt

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-audit-report
          path: |
            report.txt
            audit.json

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
